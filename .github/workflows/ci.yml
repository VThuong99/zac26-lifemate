name: CPU checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the CPU development package
        run: python -m pip install -e '.[dev]'
      - name: Lint maintained Python code
        run: python -m ruff check src tests scripts examples
      - name: Test the core and synthetic integrations
        run: python -m unittest discover -s tests -v
      - name: Test self-contained archived helpers
        run: python scripts/test_archived_helpers.py
      - name: Exercise installed demo
        run: lifemate-demo
      - name: Verify source mapping and frozen archive
        run: |
          python scripts/verify_source_layout.py
          python scripts/verify_archive.py
      - name: Check syntax, documentation links and publication boundaries
        run: python scripts/check_repository.py
      - name: Build and exercise an isolated wheel install
        run: |
          python -m pip wheel --no-deps . --wheel-dir /tmp/lifemate-wheels
          python -m venv /tmp/lifemate-wheel-test
          /tmp/lifemate-wheel-test/bin/pip install --no-deps /tmp/lifemate-wheels/*.whl
          cd /tmp
          /tmp/lifemate-wheel-test/bin/lifemate-demo
